<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opportunity Queue</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="toolbar">
        <div class="toolbar-left">
          <div class="toolbar-headline">
            <span class="toolbar-title">Opportunity Queue</span>
            <span id="countBadge" class="count-badge">0 saved</span>
          </div>
          <span id="statusText">Ready.</span>
        </div>
        <div class="toolbar-controls">
          <button id="captureBtn" class="primary-btn toolbar-btn toolbar-btn-primary">Capture</button>
          <button id="copyMarkdownBtn" class="ghost-btn toolbar-btn">Copy MD</button>
          <button id="exportJsonBtn" class="ghost-btn toolbar-btn">Export JSON</button>
          <div class="settings-wrap toolbar-settings">
            <button id="formatterSettingsBtn" class="ghost-btn toolbar-btn" type="button" aria-expanded="false">AI Format</button>
            <section id="formatterSettingsPanel" class="settings-panel" hidden>
              <form id="formatterSettingsForm" class="settings-form">
                <label class="settings-switch-row">
                  <span>Enable JD formatter</span>
                  <span class="settings-switch">
                    <input id="formatterEnabledInput" type="checkbox" role="switch" />
                    <span class="settings-switch-ui" aria-hidden="true"></span>
                  </span>
                </label>

                <label>
                  <span>Provider</span>
                  <select id="formatterProviderInput">
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic</option>
                  </select>
                </label>

                <label>
                  <span>Model</span>
                  <input id="formatterModelInput" type="text" placeholder="Model name" autocomplete="off" />
                </label>

                <label>
                  <span>Endpoint / Base URL</span>
                  <input id="formatterEndpointInput" type="text" placeholder="https://api.openai.com/v1/responses" autocomplete="off" />
                </label>

                <label>
                  <span>API Key</span>
                  <input id="formatterApiKeyInput" type="password" placeholder="sk-..." autocomplete="off" />
                </label>

                <p class="settings-note">Use OpenAI provider for OpenAI-compatible APIs (including Doubao Ark).</p>
                <p id="formatterTestStatus" class="settings-test-status" aria-live="polite"></p>

                <div class="settings-actions">
                  <button id="formatterTestBtn" type="button" class="ghost-btn settings-btn">Test</button>
                  <button id="formatterCloseBtn" type="button" class="ghost-btn settings-btn">Close</button>
                  <button id="formatterSaveBtn" type="submit" class="primary-btn settings-btn">Save</button>
                </div>
              </form>
            </section>
          </div>
        </div>
      </header>

      <main id="workspace" class="workspace">
        <section class="queue-pane">
          <div class="pane-head">
            <span>Saved Jobs</span>
          </div>
          <div class="queue-content">
            <div id="emptyState" class="empty-state">
              <div class="empty-icon">Q</div>
              <h2>No jobs captured yet</h2>
              <p>Open a BOSS listing page, click one job, then use <strong>Capture</strong>.</p>
            </div>
            <div id="jobList" class="job-list"></div>
          </div>
        </section>

        <section class="reader-pane">
          <div class="pane-head pane-head-viewing">
            <span>Detail</span>
          </div>
          <div id="readerEmpty" class="reader-empty">Select a card to read JD details.</div>

          <article id="readerCard" class="reader-card is-hidden">
            <header class="reader-header">
              <div class="reader-heading">
                <h2 id="readerRole"></h2>
                <p id="readerMeta"></p>
              </div>
              <div class="reader-actions">
                <button id="readerRawBtn" type="button" class="reader-action-btn reader-mode-btn is-active" aria-pressed="true">Raw</button>
                <button id="readerStructuredBtn" type="button" class="reader-action-btn reader-mode-btn" aria-pressed="false" hidden>Structured</button>
                <button id="readerCopyBtn" type="button" class="reader-action-btn" title="Copy JD" aria-label="Copy JD">Copy</button>
                <button id="readerOpenBtn" type="button" class="reader-action-btn" title="Open source" aria-label="Open source">Source</button>
              </div>
            </header>

            <pre id="readerJdText" class="reader-jd-text"></pre>

            <section id="readerEditorPanel" class="editor-panel is-hidden">
              <label>
                <span>Role</span>
                <input data-reader-field="role" />
              </label>
              <label>
                <span>Company</span>
                <input data-reader-field="company" />
              </label>
              <label>
                <span>Location</span>
                <input data-reader-field="location" />
              </label>
              <label class="full-width">
                <span>URL</span>
                <input data-reader-field="url" />
              </label>
              <label class="full-width">
                <span>Note</span>
                <textarea data-reader-field="note" rows="3" placeholder="Optional note"></textarea>
              </label>
            </section>

          </article>
        </section>
      </main>
    </div>

    <template id="jobCardTemplate">
      <article class="job-card" draggable="true">
        <div class="job-summary">
          <div class="drag-handle" title="Drag to reorder">::</div>

          <div class="summary-main">
            <h3 class="job-role"></h3>
            <div class="summary-subline">
              <span class="summary-company"></span>
              <span class="summary-dot" aria-hidden="true">·</span>
              <span class="summary-location"></span>
            </div>
          </div>

          <div class="summary-right">
            <div class="menu-wrap">
              <button type="button" class="menu-trigger" aria-label="Card menu" aria-expanded="false">
                <span class="menu-glyph" aria-hidden="true"></span>
              </button>
              <div class="menu-panel" hidden>
                <button type="button" class="menu-open">Open source</button>
                <button type="button" class="menu-edit">Edit fields</button>
                <button type="button" class="menu-delete">Delete</button>
              </div>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script src="sidepanel.js"></script>
  </body>
</html>
